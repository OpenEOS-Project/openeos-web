# Self-hosted / airgapped deployment for OpenEOS Web.
#
# No Traefik, no ACME/Let's Encrypt, no external "frontend" network —
# publishes the app directly on a host port. Put your own reverse proxy /
# TLS termination in front of this if you need one.
#
# NEXT_PUBLIC_API_URL / NEXT_PUBLIC_SHOP_URL below look like normal Next.js
# build-time env vars, but they're NOT baked into this image — the
# published ghcr.io image bakes sentinel tokens instead, and the
# container's entrypoint (docker-entrypoint.sh) rewrites them to whatever
# you set here on every container start. Point them at your airgapped api
# (and shop, if deployed) host.
#
# Airgap flow:
#   1. On a machine with internet access:
#        docker pull ghcr.io/openeos-project/openeos-web:latest
#        docker save -o openeos-web.tar ghcr.io/openeos-project/openeos-web:latest
#   2. Copy the tar to the offline host and load it:
#        docker load -i openeos-web.tar
#   3. docker compose -f docker-compose.airgap.yml up -d

services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/openeos-project/openeos-web:latest}
    container_name: openeos-web
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_SHOP_URL: ${NEXT_PUBLIC_SHOP_URL:-http://localhost:3004}
      SENTRY_DSN: ${SENTRY_DSN:-}
