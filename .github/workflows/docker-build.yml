name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to registry'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openeos-project/openeos-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            # Auto-incrementing build version (one per workflow run)
            type=raw,value=1.0.${{ github.run_number }},enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_VERSION=1.0.${{ github.run_number }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.openeos.de' }}
            NEXT_PUBLIC_SHOP_URL=${{ vars.NEXT_PUBLIC_SHOP_URL || 'https://shop.openeos.de' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Determine SSH port
        id: ssh-port
        run: echo "port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

      - name: Update production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.ssh-port.outputs.port }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || format('/srv/docker/{0}', github.event.repository.name) }}
            SERVICE="${{ vars.DEPLOY_SERVICE }}"

            # Remember the image currently running so a failed health check
            # below can roll back to it instead of leaving a broken deploy live.
            PREVIOUS_IMAGE=$(docker compose ps -q "$SERVICE" | xargs -r docker inspect --format='{{.Image}}' 2>/dev/null || true)

            docker compose pull "$SERVICE"
            docker compose up -d "$SERVICE"

            # Probe the container directly on its internal port rather than
            # through Traefik/DNS/TLS: this needs to catch "the new image
            # itself is broken", not unrelated proxy/certificate issues.
            CONTAINER_ID=$(docker compose ps -q "$SERVICE")
            HEALTHY=false
            for i in $(seq 1 10); do
              sleep 3
              if docker exec "$CONTAINER_ID" wget -q -O /dev/null http://localhost:3000/; then
                HEALTHY=true
                break
              fi
            done

            if [ "$HEALTHY" = "true" ]; then
              echo "Deploy healthy."
              docker image prune -f
            else
              echo "New deployment failed health check after 30s." >&2
              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "Rolling back to previous image $PREVIOUS_IMAGE" >&2
                docker tag "$PREVIOUS_IMAGE" "$(docker compose config --images "$SERVICE")"
                docker compose up -d "$SERVICE"
              else
                echo "No previous image recorded (first deploy?) — cannot roll back automatically." >&2
              fi
              exit 1
            fi
