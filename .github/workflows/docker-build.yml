name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to registry'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # `pnpm lint` isn't gated here: there is no ESLint config committed to
      # this repo at all (`next lint` drops into an interactive "how would
      # you like to configure ESLint?" prompt, which just hangs/fails in
      # CI) — this needs an actual ESLint setup first, not just a workflow
      # step. `next build` below still runs its own internal typecheck as
      # part of the Docker build; this job exists to catch the same failure
      # in ~30s instead of several minutes into that build.
      #
      # `pnpm test:e2e` (Playwright) isn't gated here either — it needs a
      # running app + backend, which this workflow doesn't stand up.

  build:
    needs: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            # Auto-incrementing build version (one per workflow run)
            type=raw,value=1.0.${{ github.run_number }},enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_VERSION=1.0.${{ github.run_number }}
            NEXT_PUBLIC_API_URL=${{ github.ref == 'refs/heads/dev' && 'https://api.staging.openeos.de' || (vars.NEXT_PUBLIC_API_URL || 'https://api.openeos.de') }}
            NEXT_PUBLIC_SHOP_URL=${{ github.ref == 'refs/heads/dev' && 'https://shop.staging.openeos.de' || (vars.NEXT_PUBLIC_SHOP_URL || 'https://shop.openeos.de') }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Determine SSH port
        id: ssh-port
        run: echo "port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

      - name: Update production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.ssh-port.outputs.port }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || format('/srv/docker/{0}', github.event.repository.name) }}
            SERVICE="${{ vars.DEPLOY_SERVICE }}"

            # Merken, welches Image gerade läuft, damit ein fehlgeschlagener
            # Health-Check darauf zurückrollen kann statt einen kaputten
            # Stand live zu lassen.
            PREVIOUS_IMAGE=$(docker compose ps -q $SERVICE 2>/dev/null | head -1 | xargs -r docker inspect --format='{{.Image}}' 2>/dev/null || true)

            docker compose pull $SERVICE
            docker compose up -d $SERVICE

            CONTAINER_ID=$(docker compose ps -q $SERVICE | head -1)
            HEALTHY=false
            for i in $(seq 1 10); do
              sleep 3
              # Bewusst 127.0.0.1 und NICHT localhost: im Container zeigt
              # localhost per /etc/hosts zuerst auf ::1, der Next-Server
              # lauscht aber nur auf IPv4 0.0.0.0 — über localhost bekommt
              # man daher immer "connection refused".
              if docker exec "$CONTAINER_ID" wget -q -O /dev/null http://127.0.0.1:3000/; then
                HEALTHY=true
                break
              fi
            done

            if [ "$HEALTHY" = "true" ]; then
              echo "Deploy healthy."
              docker image prune -f
            else
              echo "Neuer Stand hat den Health-Check nach 30s nicht bestanden." >&2
              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "Rolle zurück auf $PREVIOUS_IMAGE" >&2
                docker tag "$PREVIOUS_IMAGE" "$(docker compose config --images $SERVICE | head -1)"
                docker compose up -d $SERVICE
              else
                echo "Kein Vorgänger-Image bekannt (Erst-Deploy?) — kein automatischer Rollback möglich." >&2
              fi
              exit 1
            fi

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Determine SSH port
        id: ssh-port
        run: echo "port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

      - name: Update staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.ssh-port.outputs.port }}
          script: |
            set -e
            cd ${{ vars.STAGING_DEPLOY_PATH || format('/srv/docker/staging/{0}', github.event.repository.name) }}
            SERVICE="${{ vars.DEPLOY_SERVICE }}"

            # Merken, welches Image gerade läuft, damit ein fehlgeschlagener
            # Health-Check darauf zurückrollen kann statt einen kaputten
            # Stand live zu lassen.
            PREVIOUS_IMAGE=$(docker compose ps -q $SERVICE 2>/dev/null | head -1 | xargs -r docker inspect --format='{{.Image}}' 2>/dev/null || true)

            docker compose pull $SERVICE
            docker compose up -d $SERVICE

            CONTAINER_ID=$(docker compose ps -q $SERVICE | head -1)
            HEALTHY=false
            for i in $(seq 1 10); do
              sleep 3
              # Bewusst 127.0.0.1 und NICHT localhost: im Container zeigt
              # localhost per /etc/hosts zuerst auf ::1, der Next-Server
              # lauscht aber nur auf IPv4 0.0.0.0 — über localhost bekommt
              # man daher immer "connection refused".
              if docker exec "$CONTAINER_ID" wget -q -O /dev/null http://127.0.0.1:3000/; then
                HEALTHY=true
                break
              fi
            done

            if [ "$HEALTHY" = "true" ]; then
              echo "Deploy healthy."
              docker image prune -f
            else
              echo "Neuer Stand hat den Health-Check nach 30s nicht bestanden." >&2
              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "Rolle zurück auf $PREVIOUS_IMAGE" >&2
                docker tag "$PREVIOUS_IMAGE" "$(docker compose config --images $SERVICE | head -1)"
                docker compose up -d $SERVICE
              else
                echo "Kein Vorgänger-Image bekannt (Erst-Deploy?) — kein automatischer Rollback möglich." >&2
              fi
              exit 1
            fi
