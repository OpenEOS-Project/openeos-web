name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  # Auch Pull Requests gegen dev pruefen. Veroeffentlicht wird dabei nichts:
  # der Push ins Registry haengt an `github.event_name != 'pull_request'`,
  # und die Deploy-Jobs verlangen ohnehin ein `push`-Ereignis. Ein PR baut
  # das Abbild also nur, um zu zeigen, dass es baut.
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to registry'
        required: false
        default: true
        type: boolean
      force:
        description: 'Produktion: Deploy-Schutz übergehen (auch während eines Festes ausrollen)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Bis hierher gab es keine ESLint-Konfiguration im Repo, `next lint`
      # fiel deshalb in seinen Einrichtungsdialog und war in der CI nicht
      # verwendbar. Der Regelsatz laeuft jetzt blockierend fuer echte Fehler;
      # Altlasten stehen als Warnung in eslint.config.mjs.
      - name: Lint
        run: pnpm lint

      # Kasse, Station und Anzeigen: keine Emojis und keine Unicode-Symbole
      # als Icon-Ersatz (Regel des Designsystems @openeos/ui).
      - name: Check device views for symbols
        run: node scripts/check-pos-symbols.mjs

      # Reine Funktionen ohne Browser: Fehlerbericht-Filter (node --test)
      # sowie Kalendertage und Formatierung (Playwright-Runner, die
      # Datumstests schalten selbst zwischen mehreren Zeitzonen um).
      - name: Unit tests
        run: pnpm test:unit

      # `next build` below runs its own typecheck as part of the Docker
      # build; this job exists to catch the same failure in ~30s instead of
      # several minutes into that build.
      #
      # `pnpm test:e2e` (Playwright) laeuft in einem eigenen Workflow
      # (e2e.yml): er braucht Postgres, Redis und die API und soll dieses
      # Image nicht aufhalten, wenn nur die Oberflaeche gebaut werden muss.

  # SBOM (CycloneDX) aus dem Lockfile, als Build-Artefakt am Workflow-Lauf.
  # Vorbereitung auf den Cyber Resilience Act (Anhang I Teil II, ab 12/2027).
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: ${{ github.event.repository.name }}-sbom.cdx.json
          upload-release-assets: false

  build:
    needs: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            # Auto-incrementing build version (one per workflow run)
            type=raw,value=1.0.${{ github.run_number }},enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_VERSION=1.0.${{ github.run_number }}
            NEXT_PUBLIC_API_URL=${{ github.ref == 'refs/heads/dev' && 'https://api.staging.openeos.de' || (vars.NEXT_PUBLIC_API_URL || 'https://api.openeos.de') }}
            NEXT_PUBLIC_SHOP_URL=${{ github.ref == 'refs/heads/dev' && 'https://shop.staging.openeos.de' || (vars.NEXT_PUBLIC_SHOP_URL || 'https://shop.openeos.de') }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    # Auch per "Run workflow" auf main — mit force=true ohne Deploy-Schutz.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    # Der Deploy-Schutz wartet bis zu 90 Minuten.
    timeout-minutes: 120
    concurrency:
      group: deploy-production-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # Kein Ausrollen, solange eine Veranstaltung verkauft (echte Bestellungen
      # in den letzten 30 min): alle 5 min neu fragen, nach 90 min abbrechen.
      - name: Deploy guard
        uses: OpenEOS-Project/.github/actions/deploy-guard@main
        with:
          token: ${{ secrets.DEPLOY_GUARD_TOKEN }}
          url: ${{ vars.DEPLOY_GUARD_URL }}
          force: ${{ inputs.force && 'true' || 'false' }}

      - name: Determine SSH port
        id: ssh-port
        run: echo "port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

      # pull -> docker rollout (ohne Ausfallzeit), siehe README.
      - name: Update production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.ssh-port.outputs.port }}
          command_timeout: 20m
          script: |
            cd ${{ vars.DEPLOY_PATH || format('/srv/docker/{0}', github.event.repository.name) }}
            set -eu
            SERVICE="${{ vars.DEPLOY_SERVICE }}"
            IMAGE_PREFIX="ghcr.io/openeos-project/${{ github.event.repository.name }}"
            config_json() { docker compose config --format json; }

            # Ohne DEPLOY_SERVICE: der Dienst, der das Image dieses Repos nutzt.
            if [ -z "$SERVICE" ]; then
              SERVICE=$(config_json | jq -r --arg img "$IMAGE_PREFIX" \
                '.services | to_entries[] | select((.value.image // "") | startswith($img)) | select(.key != "migrate") | .key' | head -n1)
            fi
            if [ -z "$SERVICE" ]; then
              echo "::error::Kein Compose-Dienst mit Image $IMAGE_PREFIX gefunden." >&2
              exit 1
            fi
            IMAGE_REF=$(config_json | jq -r --arg s "$SERVICE" '.services[$s].image')

            # Laufendes Image merken: schlaegt der Deploy fehl, bekommt es das
            # Tag zurueck, damit ein spaeterer Neustart nicht den kaputten
            # Stand hochfaehrt.
            PREVIOUS_IMAGE=$(docker compose ps -q "$SERVICE" | head -n1 | xargs -r docker inspect --format '{{.Image}}' 2>/dev/null || true)
            restore_previous_tag() {
              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "Setze $IMAGE_REF zurueck auf $PREVIOUS_IMAGE" >&2
                docker tag "$PREVIOUS_IMAGE" "$IMAGE_REF"
              fi
            }

            docker compose pull "$SERVICE"

            # Migrationen als eigener Schritt vor dem Austausch der Instanzen
            # (nur wo der Server einen Dienst "migrate" hat, also bei der API).
            # Sie muessen mit dem alten Code vertraeglich sein (expand/contract).
            if config_json | jq -e '.services.migrate' >/dev/null; then
              if ! docker compose run --rm --no-deps migrate; then
                echo "::error::Migration fehlgeschlagen — die laufenden Instanzen bleiben unveraendert." >&2
                restore_previous_tag
                exit 1
              fi
            fi

            CONTAINER_NAME=$(config_json | jq -r --arg s "$SERVICE" '.services[$s].container_name // empty')
            if docker rollout --version >/dev/null 2>&1 && [ -z "$CONTAINER_NAME" ]; then
              # Ohne Ausfallzeit: neue Instanzen neben den alten starten, auf
              # "healthy" warten, die alten per /tmp/drain aus Traefik nehmen
              # (Health-Check schlaegt fehl), dann stoppen. Werden die neuen
              # nicht gesund, entfernt docker rollout sie wieder.
              if ! docker rollout --timeout 180 --pre-stop-hook 'touch /tmp/drain && sleep 15' "$SERVICE"; then
                echo "::error::Neue Instanzen wurden nicht gesund — die alten laufen weiter." >&2
                restore_previous_tag
                exit 1
              fi
            else
              # Server noch ohne docker rollout bzw. mit festem container_name:
              # Austausch wie bisher, mit kurzer Unterbrechung.
              echo "::warning::docker rollout nicht verfuegbar oder container_name gesetzt — compose up -d."
              docker compose up -d "$SERVICE"
              healthy=false
              for _ in $(seq 1 40); do
                sleep 3
                states=$(docker compose ps -q "$SERVICE" | xargs -r docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}')
                if [ -n "$states" ] && ! echo "$states" | grep -qvE '^(healthy|running)$'; then
                  healthy=true
                  break
                fi
              done
              if [ "$healthy" != "true" ]; then
                echo "::error::Neuer Stand nach 120 s nicht gesund." >&2
                restore_previous_tag
                docker compose up -d "$SERVICE"
                exit 1
              fi
            fi

            docker image prune -f

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy-staging-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Determine SSH port
        id: ssh-port
        run: echo "port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

      - name: Update staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.ssh-port.outputs.port }}
          command_timeout: 20m
          script: |
            cd ${{ vars.STAGING_DEPLOY_PATH || format('/srv/docker/staging/{0}', github.event.repository.name) }}
            set -eu
            SERVICE="${{ vars.DEPLOY_SERVICE }}"
            IMAGE_PREFIX="ghcr.io/openeos-project/${{ github.event.repository.name }}"
            config_json() { docker compose config --format json; }

            # Ohne DEPLOY_SERVICE: der Dienst, der das Image dieses Repos nutzt.
            if [ -z "$SERVICE" ]; then
              SERVICE=$(config_json | jq -r --arg img "$IMAGE_PREFIX" \
                '.services | to_entries[] | select((.value.image // "") | startswith($img)) | select(.key != "migrate") | .key' | head -n1)
            fi
            if [ -z "$SERVICE" ]; then
              echo "::error::Kein Compose-Dienst mit Image $IMAGE_PREFIX gefunden." >&2
              exit 1
            fi
            IMAGE_REF=$(config_json | jq -r --arg s "$SERVICE" '.services[$s].image')

            # Laufendes Image merken: schlaegt der Deploy fehl, bekommt es das
            # Tag zurueck, damit ein spaeterer Neustart nicht den kaputten
            # Stand hochfaehrt.
            PREVIOUS_IMAGE=$(docker compose ps -q "$SERVICE" | head -n1 | xargs -r docker inspect --format '{{.Image}}' 2>/dev/null || true)
            restore_previous_tag() {
              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "Setze $IMAGE_REF zurueck auf $PREVIOUS_IMAGE" >&2
                docker tag "$PREVIOUS_IMAGE" "$IMAGE_REF"
              fi
            }

            docker compose pull "$SERVICE"

            # Migrationen als eigener Schritt vor dem Austausch der Instanzen
            # (nur wo der Server einen Dienst "migrate" hat, also bei der API).
            # Sie muessen mit dem alten Code vertraeglich sein (expand/contract).
            if config_json | jq -e '.services.migrate' >/dev/null; then
              if ! docker compose run --rm --no-deps migrate; then
                echo "::error::Migration fehlgeschlagen — die laufenden Instanzen bleiben unveraendert." >&2
                restore_previous_tag
                exit 1
              fi
            fi

            CONTAINER_NAME=$(config_json | jq -r --arg s "$SERVICE" '.services[$s].container_name // empty')
            if docker rollout --version >/dev/null 2>&1 && [ -z "$CONTAINER_NAME" ]; then
