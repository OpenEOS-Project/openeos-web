allowBuilds:
  '@parcel/watcher': set this to true or false
  '@sentry/cli': set this to true or false
  '@swc/core': set this to true or false
  core-js: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
# pnpm 11 lehnt frisch veroeffentlichte Pakete standardmaessig ab
# (Lieferketten-Schutz). @openeos/ui 0.1.0 ist gerade erst erschienen und
# muss deshalb ausgenommen werden, sonst schlaegt die Installation in CI
# fehl. Der Eintrag kann entfallen, sobald die Version alt genug ist.
minimumReleaseAgeExclude:
  - '@openeos/ui@0.1.0'
